<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 720" width="1360" height="720" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1360" height="720" fill="#ffffff"/>

  <text x="40" y="44" font-size="24" font-weight="700" fill="#111827">Flash-Sale: Architecture</text>
  <text x="40" y="66" font-size="13" fill="#6b7280">nginx balances the API instances. Redis decides, the queue buffers, the worker writes to MongoDB.</text>

  <!-- Docker group -->
  <rect x="210" y="84" width="1120" height="590" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="230" y="110" font-size="13" font-weight="600" fill="#6b7280">Docker Compose</text>

  <!-- API group frame -->
  <rect x="450" y="150" width="240" height="395" rx="16" fill="#f3f7ff" stroke="#2f5fc4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="570" y="176" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">API x3 (--scale app=3)</text>

  <!-- Connections -->
  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M170,340 H250"/>
    <path d="M170,520 H230 V375 H250"/>
    <path d="M380,340 H420 V225 H470"/>
    <path d="M380,340 H470"/>
    <path d="M380,340 H420 V455 H470"/>
    <path d="M690,170 H830"/>
    <path d="M690,340 H830"/>
    <path d="M570,545 V595 H830"/>
    <path d="M1060,340 H1130"/>
    <path d="M1220,285 V160 H1060"/>
    <path d="M1220,395 V595 H1060"/>
  </g>

  <!-- Connection labels -->
  <g font-size="12" fill="#374151">
    <text x="210" y="328" text-anchor="middle">REST + JWT</text>
    <text x="105" y="580" text-anchor="middle">webhook + secret</text>
    <text x="760" y="160" text-anchor="middle">Lua: atomic stock</text>
    <text x="760" y="330" text-anchor="middle">add job</text>
    <text x="1095" y="330" text-anchor="middle">take job</text>
    <text x="585" y="585">users, rule 2 check, events</text>
    <text x="1068" y="150">give tickets back</text>
    <text x="1068" y="585">save bookings, expire</text>
  </g>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="40" y="300" width="130" height="80" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  </g>
  <text x="105" y="336" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Client</text>
  <text x="105" y="358" font-size="12" fill="#4b5563" text-anchor="middle">web / mobile</text>

  <!-- Payment provider -->
  <g filter="url(#shadow)">
    <rect x="40" y="480" width="130" height="80" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  </g>
  <text x="105" y="516" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Payment</text>
  <text x="105" y="534" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">provider</text>
  <text x="105" y="552" font-size="11" fill="#4b5563" text-anchor="middle">simulated</text>

  <!-- nginx -->
  <g filter="url(#shadow)">
    <rect x="250" y="290" width="130" height="100" rx="14" fill="#e9f7ef" stroke="#1e8449" stroke-width="2.5"/>
  </g>
  <text x="315" y="322" font-size="18" font-weight="700" fill="#14532d" text-anchor="middle">nginx</text>
  <text x="315" y="344" font-size="12" fill="#374151" text-anchor="middle">reverse proxy</text>
  <text x="315" y="361" font-size="12" fill="#374151" text-anchor="middle">round robin</text>
  <text x="315" y="378" font-size="12" fill="#374151" text-anchor="middle">:3000 to :80</text>

  <!-- API instances -->
  <g filter="url(#shadow)">
    <rect x="470" y="190" width="200" height="70" rx="12" fill="#e8f0fe" stroke="#2f5fc4" stroke-width="2.5"/>
    <rect x="470" y="305" width="200" height="70" rx="12" fill="#e8f0fe" stroke="#2f5fc4" stroke-width="2.5"/>
    <rect x="470" y="420" width="200" height="70" rx="12" fill="#e8f0fe" stroke="#2f5fc4" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle">
    <text x="570" y="222" font-size="16" font-weight="700" fill="#1e3a8a">app-1</text>
    <text x="570" y="242" font-size="12" fill="#374151">Node.js + Express 5</text>
    <text x="570" y="337" font-size="16" font-weight="700" fill="#1e3a8a">app-2</text>
    <text x="570" y="357" font-size="12" fill="#374151">Node.js + Express 5</text>
    <text x="570" y="452" font-size="16" font-weight="700" fill="#1e3a8a">app-3</text>
    <text x="570" y="472" font-size="12" fill="#374151">Node.js + Express 5</text>
    <text x="570" y="512" font-size="12" fill="#374151">JWT · rate limit · idempotency</text>
    <text x="570" y="532" font-size="12" font-weight="600" fill="#1e3a8a">GET /health · answers 202 + bookingId</text>
  </g>

  <!-- Stock Redis -->
  <g filter="url(#shadow)">
    <rect x="830" y="100" width="230" height="120" rx="14" fill="#fdecea" stroke="#c53030" stroke-width="2.5"/>
  </g>
  <text x="945" y="132" font-size="18" font-weight="700" fill="#7f1d1d" text-anchor="middle">Stock Redis</text>
  <text x="945" y="158" font-size="12" fill="#374151" text-anchor="middle">live stock counters (Lua)</text>
  <text x="945" y="178" font-size="12" fill="#374151" text-anchor="middle">idempotency · rate limit</text>
  <text x="945" y="198" font-size="12" fill="#374151" text-anchor="middle">booking status · webhook keys</text>

  <!-- Queue Redis -->
  <g filter="url(#shadow)">
    <rect x="830" y="285" width="230" height="110" rx="14" fill="#fdecea" stroke="#c53030" stroke-width="2.5"/>
  </g>
  <text x="945" y="318" font-size="18" font-weight="700" fill="#7f1d1d" text-anchor="middle">Queue Redis</text>
  <text x="945" y="344" font-size="12" fill="#374151" text-anchor="middle">BullMQ "bookings" queue</text>
  <text x="945" y="364" font-size="12" fill="#374151" text-anchor="middle">maxmemory 256mb</text>
  <text x="945" y="382" font-size="12" fill="#374151" text-anchor="middle">noeviction</text>

  <!-- Worker -->
  <g filter="url(#shadow)">
    <rect x="1130" y="285" width="180" height="110" rx="14" fill="#fff4e0" stroke="#c77b0a" stroke-width="2.5"/>
  </g>
  <text x="1220" y="318" font-size="18" font-weight="700" fill="#7c4a03" text-anchor="middle">Worker</text>
  <text x="1220" y="344" font-size="12" fill="#374151" text-anchor="middle">saves reserved bookings</text>
  <text x="1220" y="364" font-size="12" fill="#374151" text-anchor="middle">3 attempts, backoff</text>
  <text x="1220" y="382" font-size="12" fill="#374151" text-anchor="middle">expiry job every 30 s</text>

  <!-- MongoDB -->
  <g filter="url(#shadow)">
    <rect x="830" y="540" width="230" height="110" rx="14" fill="#e6f4ea" stroke="#2f855a" stroke-width="2.5"/>
  </g>
  <text x="945" y="573" font-size="18" font-weight="700" fill="#14532d" text-anchor="middle">MongoDB</text>
  <text x="945" y="599" font-size="12" fill="#374151" text-anchor="middle">users · events · bookings</text>
  <text x="945" y="619" font-size="12" fill="#374151" text-anchor="middle">partial unique index</text>
  <text x="945" y="637" font-size="12" fill="#374151" text-anchor="middle">(userId + eventId)</text>

  <text x="40" y="704" font-size="12" fill="#6b7280">The worker runs as a single instance. Secrets (JWT, webhook) come from .env.</text>
</svg>
