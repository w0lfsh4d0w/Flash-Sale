services:
  app:
    build: .
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      - mongo_db
      - redis
      - redis_queue

  worker:
    build: .
    command: node worker.js
    restart: on-failure
    env_file:
      - .env
    depends_on:
      - mongo_db
      - redis_queue
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mongo_db:
    image: mongo:latest
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ticket_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  redis_queue:
    image: redis:7-alpine
    container_name: ticket_redis_queue
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_queue_data:/data

volumes:
  mongo_data:
  redis_data:
  redis_queue_data: