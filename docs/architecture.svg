<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="40" y="44" font-size="24" font-weight="700" fill="#111827">Flash-Sale: Architecture</text>
  <text x="40" y="66" font-size="13" fill="#6b7280">Booking path: Redis decides, the queue buffers, the worker writes to MongoDB</text>

  <!-- Docker group -->
  <rect x="250" y="84" width="920" height="590" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="270" y="110" font-size="13" font-weight="600" fill="#6b7280">Docker Compose</text>

  <!-- Connections -->
  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M190,340 H300"/>
    <path d="M190,520 H270 V385 H300"/>
    <path d="M420,250 V160 H640"/>
    <path d="M540,340 H640"/>
    <path d="M420,430 V590 H640"/>
    <path d="M860,340 H920"/>
    <path d="M1020,285 V160 H860"/>
    <path d="M1020,395 V590 H860"/>
  </g>

  <!-- Connection labels -->
  <g font-size="12" fill="#374151">
    <text x="245" y="328" text-anchor="middle">REST + JWT</text>
    <text x="115" y="580" text-anchor="middle">webhook + secret</text>
    <text x="432" y="150">Lua: check + decrement stock</text>
    <text x="590" y="328" text-anchor="middle">add job</text>
    <text x="890" y="328" text-anchor="middle">take job</text>
    <text x="432" y="580">users, rule 2 check, events</text>
    <text x="870" y="150">give tickets back, status keys</text>
    <text x="870" y="580">save bookings, expire</text>
  </g>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="40" y="300" width="150" height="80" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  </g>
  <text x="115" y="336" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Client</text>
  <text x="115" y="358" font-size="12" fill="#4b5563" text-anchor="middle">web / mobile</text>

  <!-- Payment provider -->
  <g filter="url(#shadow)">
    <rect x="40" y="480" width="150" height="80" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  </g>
  <text x="115" y="516" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Payment provider</text>
  <text x="115" y="538" font-size="12" fill="#4b5563" text-anchor="middle">simulated</text>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="300" y="250" width="240" height="180" rx="14" fill="#e8f0fe" stroke="#2f5fc4" stroke-width="2.5"/>
  </g>
  <text x="420" y="292" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">API</text>
  <text x="420" y="316" font-size="13" fill="#1e3a8a" text-anchor="middle">Node.js + Express 5</text>
  <text x="420" y="344" font-size="12" fill="#374151" text-anchor="middle">JWT auth · rate limit</text>
  <text x="420" y="364" font-size="12" fill="#374151" text-anchor="middle">idempotency · rule 2 check</text>
  <text x="420" y="384" font-size="12" fill="#374151" text-anchor="middle">pay + webhook endpoints</text>
  <text x="420" y="410" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">answers 202 + bookingId</text>

  <!-- Stock Redis -->
  <g filter="url(#shadow)">
    <rect x="640" y="100" width="220" height="120" rx="14" fill="#fdecea" stroke="#c53030" stroke-width="2.5"/>
  </g>
  <text x="750" y="132" font-size="18" font-weight="700" fill="#7f1d1d" text-anchor="middle">Stock Redis</text>
  <text x="750" y="158" font-size="12" fill="#374151" text-anchor="middle">live stock counters (Lua)</text>
  <text x="750" y="178" font-size="12" fill="#374151" text-anchor="middle">idempotency · rate limit</text>
  <text x="750" y="198" font-size="12" fill="#374151" text-anchor="middle">booking status · webhook keys</text>

  <!-- Queue Redis -->
  <g filter="url(#shadow)">
    <rect x="640" y="285" width="220" height="110" rx="14" fill="#fdecea" stroke="#c53030" stroke-width="2.5"/>
  </g>
  <text x="750" y="318" font-size="18" font-weight="700" fill="#7f1d1d" text-anchor="middle">Queue Redis</text>
  <text x="750" y="344" font-size="12" fill="#374151" text-anchor="middle">BullMQ "bookings" queue</text>
  <text x="750" y="364" font-size="12" fill="#374151" text-anchor="middle">maxmemory 256mb</text>
  <text x="750" y="382" font-size="12" fill="#374151" text-anchor="middle">noeviction</text>

  <!-- Worker -->
  <g filter="url(#shadow)">
    <rect x="920" y="285" width="200" height="110" rx="14" fill="#fff4e0" stroke="#c77b0a" stroke-width="2.5"/>
  </g>
  <text x="1020" y="318" font-size="18" font-weight="700" fill="#7c4a03" text-anchor="middle">Worker</text>
  <text x="1020" y="344" font-size="12" fill="#374151" text-anchor="middle">saves reserved bookings</text>
  <text x="1020" y="364" font-size="12" fill="#374151" text-anchor="middle">3 attempts, backoff</text>
  <text x="1020" y="382" font-size="12" fill="#374151" text-anchor="middle">expiry job every 30 s</text>

  <!-- MongoDB -->
  <g filter="url(#shadow)">
    <rect x="640" y="535" width="220" height="110" rx="14" fill="#e6f4ea" stroke="#2f855a" stroke-width="2.5"/>
  </g>
  <text x="750" y="568" font-size="18" font-weight="700" fill="#14532d" text-anchor="middle">MongoDB</text>
  <text x="750" y="594" font-size="12" fill="#374151" text-anchor="middle">users · events · bookings</text>
  <text x="750" y="614" font-size="12" fill="#374151" text-anchor="middle">partial unique index</text>
  <text x="750" y="632" font-size="12" fill="#374151" text-anchor="middle">(userId + eventId)</text>

  <!-- Legend -->
  <text x="40" y="692" font-size="12" fill="#6b7280">Planned (stage 6): nginx in front of the API, more than one API and worker instance.</text>
</svg>
